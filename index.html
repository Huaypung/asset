:root{--bg:#fff;--card:#fff;--fg:#0f172a;--mut:#64748b;--line:#e6e9f2;--fill:#f1f3f9;--acc:#4f46e5;--on:#fff;--t2:#e0e7ff;--t2f:#3730a3;--t3:#fef3c7;--t3f:#92400e;--bad:#dc2626;--hov:#f6f7fd;--sh:0 1px 2px rgba(15,23,42,.04),0 12px 32px rgba(79,70,229,.1);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 "Noto Sans Thai",system-ui,sans-serif}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.app{display:none;min-height:100vh}.in .app{display:flex}
#lg{min-height:100vh;display:grid;place-items:center;padding:24px;position:relative;overflow:hidden}.in #lg{display:none}
#lg::before{content:"";position:absolute;inset:-24px;background:linear-gradient(rgba(255,255,255,.5),rgba(255,255,255,.62)),var(--bg-img) center/cover;filter:blur(9px)}
#lg .wl{position:relative;background:rgba(255,255,255,.8);border-radius:26px;padding:34px 30px 24px;max-width:360px;text-align:center;box-shadow:0 10px 40px rgba(15,23,42,.12)}
.wl h2{font:600 26px/1.3 Prompt,sans-serif;margin:0 0 8px}.wl p{margin:0;color:var(--mut)}
.logo{width:46px;height:46px;border-radius:50%;background:#fff var(--logo) center/contain no-repeat;flex:none;display:block}.logo.big{width:96px;height:96px;margin:0 auto 14px}
.sd{width:250px;flex:none;box-sizing:border-box;position:sticky;top:0;height:100vh;height:100dvh;overflow-y:auto;background:var(--card);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;z-index:30}
.br{display:flex;gap:10px;align-items:center;padding:0 8px 14px}.br b{display:block;font:600 16px/1.3 Prompt,sans-serif}
.mb2{margin-left:auto;width:36px;min-height:36px;padding:0;display:grid;place-items:center;background:none;color:var(--mut);border:0}
#tabs{display:flex;flex-direction:column;gap:3px}.gl{font-size:12px;color:var(--mut);padding:14px 12px 4px}
#tabs button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;color:var(--mut);padding:9px 12px;border-radius:12px;font-weight:500}
#tabs button:hover{background:var(--fill);color:var(--fg)}#tabs button.on{background:var(--t2);color:var(--t2f);font-weight:600}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sf{margin-top:auto;padding:16px 8px 0;font-size:12px;line-height:1.6;color:var(--mut)}
.ct2{flex:1;min-width:0}.sh{display:none}
.tb{display:flex;align-items:center;gap:10px;max-width:1240px;margin:0 auto;padding:22px 18px 0}.tb b{font:600 24px/1.3 Prompt,sans-serif}
.mb{display:grid;place-items:center;width:42px;padding:0;flex:none}
main{max-width:1240px;margin:0 auto;padding:14px 18px 56px}.mut,small{color:var(--mut)}
@media(min-width:861px){.sdh .sd{display:none}}
input,select,button{font:inherit;color:var(--fg);background:var(--fill);border:1px solid transparent;border-radius:12px;padding:9px 13px;min-height:42px;max-width:100%;box-sizing:border-box}
input:focus,select:focus{border-color:var(--acc);outline:0;background:#fff}
button{cursor:pointer;font-weight:500}button.pri{background:var(--acc);color:var(--on);font-weight:600}
button.sm{min-height:30px;padding:3px 11px;font-size:13px;border-radius:9px;background:var(--fill)}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px;align-items:center}.bar input{flex:1 1 220px}
.li{width:150px;min-height:32px;padding:4px 9px;font-size:13px}
.sc{overflow:auto;border:1px solid var(--line);border-radius:16px;background:var(--card);max-height:calc(100vh - 250px)}
table{border-collapse:separate;border-spacing:0;width:100%;min-width:940px;font-size:14px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{position:sticky;top:0;z-index:2;background:var(--fill);font-weight:600;color:#475569;font-size:13px;white-space:nowrap}
tbody tr:nth-child(even) td{background:#fafbfe}tbody tr:hover td{background:var(--hov)}tr:last-child td{border-bottom:0}
td.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}td.nw{white-space:nowrap}
tfoot td{font-weight:600;background:var(--fill)}
.t{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:99px;font-size:13px;font-weight:500;white-space:nowrap}
.t::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.r2{background:var(--t2);color:var(--t2f)}.r3{background:var(--t3);color:var(--t3f)}.sg{background:#dcfce7;color:#166534}.sb{background:#fee2e2;color:#991b1b}.sl{background:var(--t3);color:var(--t3f)}.bd{color:var(--bad)}
.prog{height:10px;background:var(--fill);border-radius:5px;overflow:hidden;margin:6px 0 14px}.prog i{display:block;height:100%;background:var(--acc);border-radius:5px}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;max-width:800px;border:1px solid var(--line);border-radius:18px;padding:22px}
.f label,dialog label{display:flex;flex-direction:column;gap:5px;font-size:14px;color:var(--mut)}
dialog{border:1px solid var(--line);border-radius:22px;background:var(--card);color:var(--fg);width:min(92%,680px);max-width:none;box-shadow:var(--sh);padding:22px}
dialog::backdrop{background:rgba(10,14,28,.5)}dialog label{margin:12px 0}dialog h3{margin:0 0 4px;font:600 18px Prompt,sans-serif}dialog h4{margin:16px 0 6px}
dialog table{min-width:520px}dialog .sc{max-height:240px}
.hero2{border-radius:24px;overflow:hidden;color:#fff;text-align:center;padding:44px 20px 38px;margin-bottom:22px;background:linear-gradient(rgba(8,22,40,.28),rgba(8,22,40,.62)),var(--bg-img) center 62%/cover}
.hero2 .logo.big{width:108px;height:108px;margin:0 auto;border:4px solid #fff;box-shadow:0 6px 20px rgba(0,0,0,.35)}
.hero2 h2{font:600 30px/1.3 Prompt,sans-serif;margin:14px 0 6px;text-shadow:0 2px 10px rgba(0,0,0,.45)}.hero2 p{margin:0;color:#f1f5ff;text-shadow:0 1px 8px rgba(0,0,0,.5)}
.mg{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.mc{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px}
.mc svg{width:28px;height:28px;color:var(--acc);margin-bottom:4px}.mc b{font:600 16px Prompt,sans-serif}.mc small{font-weight:400}.mc:hover{border-color:var(--acc);box-shadow:var(--sh)}
.paper{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;overflow:auto;color:#111}
.paper table{min-width:0;font-size:13px}.paper th{position:static;background:#f1f2f7;color:#111;border:1px solid #c9cde0}.paper td{border:1px solid #d5d9e6;padding:5px 8px;background:#fff!important}
.paper tr.g td{background:#eceef8!important;font-weight:600}.paper tr.sub td{font-weight:600;background:#fafbff!important}
.rh{text-align:center;margin-bottom:12px}.rh h2{margin:2px 0;font:600 20px Prompt,sans-serif}
.sig{display:flex;justify-content:space-around;margin-top:38px;text-align:center}.sig div{width:30%}
@media(max-width:860px){.sd{position:fixed;left:0;top:0;bottom:0;height:auto;padding-top:calc(20px + env(safe-area-inset-top,0px));transform:translateX(-105%);transition:transform .2s}
.sd.open{transform:none;box-shadow:var(--sh)}.sh.open{display:block;position:fixed;inset:0;background:rgba(10,14,28,.45);z-index:20}.tb{padding-top:14px}.tb b{font-size:20px}.sc{max-height:calc(100dvh - 230px)}}
@media(max-width:640px){.hero2{padding:32px 14px 28px}.hero2 h2{font-size:24px}main{padding:12px 12px 48px}}
@media print{body{background:#fff}.sd,.tb,.noprint,#lg,footer,.sh,dialog{display:none!important}.app,.ct2{display:block!important}main{max-width:none;padding:0}.paper{border:0;padding:0}.sc{max-height:none}@page{size:A4 landscape;margin:10mm}tr{break-inside:avoid}thead{display:table-header-group}}

th{background:linear-gradient(90deg,#4f46e5,#7c3aed)!important;color:#fff!important;border-bottom:0}
.sheet th,.paper th{background:#f1f2f7!important;color:#111!important}
tbody tr:nth-child(even) td{background:#f7f8ff}tbody tr:hover td{background:#eef0ff}
tbody tr td:first-child{border-left:4px solid transparent}
tr[data-r="สท.2"] td:first-child{border-left-color:#3b82f6}tr[data-r="สท.3"] td:first-child{border-left-color:#f59e0b}
.cc{display:inline-block;padding:1px 9px;border-radius:8px;font-size:13px;font-weight:500;white-space:nowrap}
.paper .cc{background:none!important;color:inherit!important;padding:0}
td.pr{color:#047857;font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:0 0 14px}
.tile{border-radius:16px;padding:10px 14px;background:#fff;border:1px solid var(--line);border-top:4px solid var(--c)}.tile b{display:block;font:600 24px/1.2 Prompt,sans-serif;color:var(--c)}
.pager{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:12px}.pager .sp{flex:1}.pager select{min-height:34px;padding:4px 8px}.pager label{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--mut)}
button:disabled{opacity:.4;cursor:default}.sm.bad,button.bad{background:#fee2e2;color:#991b1b}
.ck2{display:flex;align-items:center;gap:6px;font-size:14px}.ck2 input{min-height:0;width:18px;height:18px}
.h3{margin:0 0 6px;font:600 17px Prompt,sans-serif}.dt{margin-top:6px}.dt summary{cursor:pointer;font-weight:600;padding:8px 0}
dialog{max-height:90vh;overflow:auto}
.sheet{background:#fff;border:1px solid #cbd0e2;border-radius:10px;padding:16px 20px;margin-bottom:16px;color:#111;font-size:12.5px;line-height:1.5}
.sheet .tt{text-align:center;font:600 16px Prompt,sans-serif}.sheet .tc{text-align:center}.sheet .tr{text-align:right;font-size:12px}
.sheet .rw{display:flex;justify-content:space-between;margin:4px 0}
.cols{display:grid;grid-template-columns:1.15fr 1fr 1.1fr;border:1px solid #333}.cols>div{padding:6px 10px;border-right:1px solid #333}.cols>div:last-child{border-right:0}
.ln{display:flex;gap:6px;border-bottom:1px dotted #999;padding:1px 0}.ln span{white-space:nowrap}.ln b{font-weight:500;flex:1}
.sh2{font-weight:600;margin-top:4px}.sh2.c{text-align:center;margin:8px 0 4px}.ct{margin:6px 0;border-top:1px solid #333;padding-top:4px}
.ph{margin-top:8px;border:1px solid #333;min-height:90px;padding:4px;font-size:12px;text-align:center}
.sheet table{min-width:0;font-size:12px;width:100%}.sheet td{border:1px solid #cfd3e3;padding:4px 7px;background:#fff!important}.sheet th{position:static;border:1px solid #cfd3e3;padding:4px 7px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.pn{text-align:center;margin:4px 0}

function saveLoan(){const item=$('#m1').value.trim(),who=$('#m2').value.trim(),ap=$('#m6').value.trim();if(!item)return alert('กรอกชื่อครุภัณฑ์ที่ยืม');if(!who)return alert('กรอกชื่อผู้ยืม');if(!ap)return alert('กรอกชื่อผู้อนุมัติ');

function retLoan(i,id){if(String(i)[0]==='L'){const l=LN.find(v=>v.i===i);if(l){l.ret=today();putLn(l,'รับคืน: '+l.item+' ('+l.who+')')}return}const x=get(+i),l=x.loans.find(v=>v.id===id);l.ret=today();put(x,'รับคืน: '+l.who);paint(1)}
function delLoan(i,id){if(!confirm('ลบรายการยืมนี้?'))return;if(String(i)[0]==='L'){if(CAN)db.collection('assets').doc(i).delete().then(()=>db.collection('history').add({t:TS(),by:ME,act:'ลบรายการยืม',code:'',name:''})).catch(e=>alert('ลบไม่สำเร็จ: '+e.message));return}const x=get(+i);x.loans=x.loans.filter(v=>v.id!==id);put(x,'ลบรายการยืม');paint(1)}

function pImp(){return`<p>เลือกไฟล์ Excel แบบ สท.2 หรือ สท.3 ระบบอ่านชื่อชีตเป็นหมวด และอ่านหัวรายงานเพื่อแยกทะเบียน</p><input type="file" accept=".xlsx" onchange="imp(this)"><div id="ip" style="margin-top:12px"></div><p class="mut">นำเข้าแต่ละไฟล์เพียงครั้งเดียว ถ้านำเข้าซ้ำ รายการจะซ้ำ</p>`}
async function imp(inp){const f=inp.files[0];if(!f)return;P=[];const cnt={};
 try{const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});
 for(const n of wb.SheetNames){const r=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:null}),reg=/สท\.?\s*(3|๓)/.test(r.slice(0,3).flat().join(' '))?'สท.3':'สท.2',s2=reg==='สท.2';
  for(const a of r){if(typeof a[0]!=='number'||!a[1])continue;let d=a[4],iso=null;
   if(typeof d==='number'){const c=XLSX.SSF.parse_date_code(d);iso=c.y+'-'+p2(c.m)+'-'+p2(c.d)}else{const m=String(d||'').match(/(\d+)\/(\d+)\/(\d{4})/);if(m)iso=m[3]+'-'+p2(m[2])+'-'+p2(m[1])}
   P.push({cat:n,reg:reg,name:String(a[1]).trim(),unit:a[2]||'',code:String(a[3]||'').trim(),d:iso,life:s2?a[5]:null,cost:+a[s2?6:5]||0,dep:s2&&typeof a[7]==='number'?a[7]:null,st:'ใช้งาน',note:'',loc:''});cnt[reg+' '+n]=(cnt[reg+' '+n]||0)+1}}
 $('#ip').innerHTML=P.length?'<div class="sc" style="padding:10px;max-height:none">พบ '+P.length+' รายการ<br>'+Object.entries(cnt).map(a=>esc(a[0])+': '+a[1]).join('<br>')+'</div><p><button class="pri" onclick="commit()">ยืนยันนำเข้า</button></p>':'<p class="bd">ไม่พบรายการในไฟล์นี้</p>'
 }catch(e){$('#ip').innerHTML='<p class="bd">อ่านไฟล์ไม่ได้ ลองบันทึกไฟล์เป็น .xlsx ใหม่</p>'}}
async function commit(){if(!CAN)return;let n=nid();const arr=P;P=[];
 try{for(let k=0;k<arr.length;k+=400){const b=db.batch();arr.slice(k,k+400).forEach(x=>{x.i=n++;b.set(db.collection('assets').doc(String(x.i)),x)});await b.commit();$('#ip').textContent='นำเข้าแล้ว '+Math.min(k+400,arr.length)+' / '+arr.length}
 await db.collection('history').add({t:TS(),by:ME,act:'นำเข้า Excel '+arr.length+' รายการ',code:'',name:''});go('reg')}catch(e){alert('นำเข้าไม่สำเร็จ: '+e.message)}}
function pSet(){const n=S.length,d=S.filter(x=>x.st==='จำหน่ายแล้ว').length;
 return`<div class="f" style="max-width:680px;grid-template-columns:1fr;gap:22px"><div><h3 class="h3">สำรองข้อมูล</h3><p class="mut" style="margin:0 0 10px">ดาวน์โหลดข้อมูลทั้งหมด ${n} รายการ (ทะเบียน การยืม ซ่อมบำรุง) เป็นไฟล์ Excel ควรทำทุกครั้งก่อนลบหรือรีเซตข้อมูล</p><button class="pri" onclick="exportXlsx()">ส่งออก Excel</button></div>
 <div><h3 class="h3">ลบรายการที่จำหน่ายแล้ว</h3><p class="mut" style="margin:0 0 10px">ลบรายการที่มีสถานะ "จำหน่ายแล้ว" ออกจากระบบถาวร ตอนนี้มี ${d} รายการ</p><button class="sm bad" onclick="delDisposed()">ลบรายการที่จำหน่ายแล้ว</button></div>
 <div style="border-top:1px solid var(--line);padding-top:18px"><h3 class="h3 bd">รีเซตข้อมูลทั้งหมด</h3><p class="mut" style="margin:0 0 10px">ลบครุภัณฑ์ทุกรายการ (รวมประวัติการยืมและซ่อมของแต่ละรายการ) ย้อนกลับไม่ได้ ส่วนประวัติของระบบ (เมนูประวัติระบบ) จะไม่ถูกลบ</p><div class="bar"><input id="rc" placeholder="พิมพ์คำว่า ลบทั้งหมด เพื่อยืนยัน" style="flex:1 1 240px"><button class="sm bad" onclick="resetAll()">รีเซตข้อมูลทั้งหมด</button></div></div></div>`}
function delDisposed(){const ids=S.filter(x=>x.st==='จำหน่ายแล้ว').map(x=>x.i);if(!ids.length)return alert('ไม่มีรายการที่จำหน่ายแล้ว');if(!confirm('ลบรายการที่จำหน่ายแล้ว '+ids.length+' รายการ ถาวร?\nแนะนำให้ส่งออก Excel สำรองไว้ก่อน'))return;rm(ids,'ลบรายการจำหน่ายแล้ว').then(()=>render())}
function resetAll(){if($('#rc').value.trim()!=='ลบทั้งหมด')return alert('พิมพ์คำว่า ลบทั้งหมด ให้ถูกต้องก่อน');if(!S.length)return alert('ไม่มีข้อมูลให้ลบ');if(!confirm('ลบครุภัณฑ์ทั้ง '+S.length+' รายการ ถาวร?\nแนะนำให้ส่งออก Excel สำรองไว้ก่อน'))return;rm(S.map(x=>x.i),'รีเซตข้อมูล ลบ').then(()=>render())}
function exportXlsx(){if(!window.XLSX)return alert('ตัวช่วย Excel ยังโหลดไม่เสร็จ ลองอีกครั้ง');
 const R=S.map(x=>({'รหัส':x.code,'รายการ':x.name,'หน่วย':x.unit,'หมวด':x.cat,'ทะเบียน':x.reg,'วันที่ได้มา':fd(x.d),'ราคาทุน':x.cost,'อายุการใช้งาน':x.life,'ค่าเสื่อมสะสม':x.dep,'สถานที่ตั้ง':x.loc||'','สถานะ':stat(x),'หมายเหตุ':x.note||''})),Lo=[],Rp=[];
 LN.forEach(l=>Lo.push({'รหัส':'','ครุภัณฑ์':l.item,'ผู้ยืม':l.who,'ผู้อนุมัติ':l.appr||'','วันที่ยืม':fd(l.out),'กำหนดคืน':fd(l.due),'วันที่คืน':fd(l.ret),'หมายเหตุ':l.note||''}));S.forEach(x=>{(x.loans||[]).forEach(l=>Lo.push({'รหัส':x.code,'ครุภัณฑ์':x.name,'ผู้ยืม':l.who,'ผู้อนุมัติ':l.appr||'','วันที่ยืม':fd(l.out),'กำหนดคืน':fd(l.due),'วันที่คืน':fd(l.ret),'หมายเหตุ':l.note||''}));(x.repairs||[]).forEach(r=>Rp.push({'รหัส':x.code,'ครุภัณฑ์':x.name,'วันที่':fd(r.d),'ประเภท':r.type,'รายละเอียด':r.what,'ผู้ซ่อม':r.by,'ค่าใช้จ่าย':r.cost,'หนังสืออนุมัติ':r.doc||''}))});
 const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(R),'ทะเบียน');XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(Lo),'การยืม');XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(Rp),'ซ่อมบำรุง');XLSX.writeFile(wb,'ทะเบียนครุภัณฑ์_'+today()+'.xlsx')}
let LOGS=null;
function pLog(){LOGS=null;return(CAN?'<div class="bar noprint"><button class="sm bad" onclick="clearLog()">รีเซตประวัติการทำรายการ (ล้างทั้งหมด)</button></div>':'')+'<div id="lst"><p class="mut">กำลังโหลด...</p></div>'}
async function clearLog(){if(!CAN)return;if(!confirm('ล้างประวัติการทำรายการทั้งหมด? ลบแล้วกู้คืนไม่ได้'))return;if(prompt('พิมพ์คำว่า ล้างประวัติ เพื่อยืนยัน')!=='ล้างประวัติ')return;
 try{for(;;){const q=await db.collection('history').limit(400).get();if(q.empty)break;const b=db.batch();q.docs.forEach(d=>b.delete(d.ref));await b.commit()}
  await db.collection('history').add({t:TS(),by:ME,act:'รีเซตประวัติการทำรายการ',code:'',name:''});LOGS=null;loadLog()}catch(e){alert('ล้างประวัติไม่สำเร็จ: '+e.message)}}
async function loadLog(){try{const s=await db.collection('history').orderBy('t','desc').limit(300).get();LOGS=s.docs.map(d=>d.data());paint(1)}catch(e){if($('#lst'))$('#lst').textContent='โหลดประวัติไม่สำเร็จ: '+e.message}}
function paintLog(){if(!LOGS)return;$('#lst').innerHTML=tbl(['เวลา','ผู้ทำรายการ','สิ่งที่ทำ','ครุภัณฑ์'],LOGS.map(x=>`<tr><td class="nw">${x.t&&x.t.toDate?x.t.toDate().toLocaleString('th-TH'):'-'}</td><td>${esc(x.by)}</td><td>${esc(x.act)}</td><td>${esc(x.code)} ${esc(x.name)}</td></tr>`))}
/* ล็อกอิน */
async function loginPin(){const pin=$('#pin').value;if(!pin)return;if(!auth){$('#lm').textContent='ยังไม่ได้ใส่ค่า Firebase ในไฟล์';return}
 $('#lm').textContent='กำลังตรวจสอบ...';
 for(const em of ['edit@asset.local','view@asset.local']){
  try{await auth.signInWithEmailAndPassword(em,pin);$('#lm').textContent='';return}
  catch(e){if(e.code==='auth/too-many-requests'){$('#lm').textContent='ลองผิดหลายครั้งเกินไป รอสักครู่แล้วลองใหม่';return}
   if(e.code==='auth/operation-not-allowed'){$('#lm').textContent='ยังไม่ได้เปิดล็อกอินแบบอีเมลและรหัสผ่านใน Firebase';return}
   if(e.code==='auth/network-request-failed'){$('#lm').textContent='เชื่อมต่ออินเทอร์เน็ตไม่ได้';return}}}
 $('#lm').textContent='รหัสผ่านไม่ถูกต้อง'}
function out(){if(auth)auth.signOut()}
function denied(u){document.body.classList.remove('in');$('#lm').innerHTML='บัญชี '+esc(u.email)+' ยังไม่ได้รับอนุญาต ติดต่อผู้ดูแลระบบ<br><a href="#" onclick="out();return false">ใช้บัญชีอื่น</a>'}
function start(u,role){CAN=role==='editor';ME=u.email;document.body.classList.add('in');
 $('#me').innerHTML=(CAN?'สิทธิ์แก้ไข':'ดูอย่างเดียว')+' · <a href="#" onclick="out();return false">ออกจากระบบ</a>';
 let ck=null;tab='home';
 unsub=db.collection('assets').onSnapshot(s=>{const AD=s.docs.map(d=>d.data());S=AD.filter(x=>!x.ln);LN=AD.filter(x=>x.ln);const k=cats().join('|');if(ck===null||k!==ck){ck=k;render()}else paint(1)},e=>alert('อ่านข้อมูลไม่ได้: '+e.message))}
firebase.initializeApp(CFG);auth=firebase.auth();db=firebase.firestore();
auth.onAuthStateChanged(async u=>{if(unsub){unsub();unsub=null}
 if(!u){document.body.classList.remove('in');$('#lm').textContent='';return}
 try{const r=await db.collection('users').doc(u.email.toLowerCase()).get();if(!r.exists)return denied(u);start(u,r.data().role)}catch(e){denied(u)}});
</script></body></html>
