function home(){
 const c=[['reg','ทะเบียนครุภัณฑ์','ดูและค้นหารายการทั้งหมด แยกตามหมวดหรือทะเบียน สท.2 / สท.3'],['chk','ตรวจสอบครุภัณฑ์','บันทึกผลการตรวจประจำปี'],['add','รับเข้าใหม่','เพิ่มครุภัณฑ์ที่ซื้อมาใหม่'],['out','จำหน่ายแล้ว','ดูรายการที่จำหน่ายแล้ว'],['imp','นำเข้า Excel','นำเข้าไฟล์ สท.2 และ สท.3'],['log','ประวัติ','ดูว่าใครทำรายการอะไรเมื่อไร']];
 return `<div class="wl"><div class="logo big">ค</div><h2>ระบบทะเบียนครุภัณฑ์</h2><p>โรงพยาบาลส่งเสริมสุขภาพตำบลบ้านห้วยผึ้ง<br>อำเภอน้ำปาด จังหวัดอุตรดิตถ์</p></div><div class="mg">${c.filter(x=>TT().some(t=>t[0]===x[0])).map(x=>`<button class="mc" onclick="go('${x[0]}')"><svg viewBox="0 0 24 24">${IC[x[0]]}</svg><b>${x[1]}</b><small>${x[2]}</small></button>`).join('')}</div>${S.length?'':'<p class="mut" style="text-align:center;margin-top:24px">ยังไม่มีข้อมูลในระบบ ผู้ดูแลไปที่เมนูนำเข้า Excel เพื่อนำเข้าไฟล์ สท.2 และ สท.3</p>'}`}
function goCat(i){F={q:'',reg:'',cat:CATS[i],st:'',g:''};tab='reg';render()}
function grouped(L){if(!F.g)return[['',L]];const m=new Map();L.forEach(x=>{const k=x[F.g];if(!m.has(k))m.set(k,[]);m.get(k).push(x)});return[...m]}
function table(head,row,L){
 if(!L.length)return'<p class="mut">ไม่พบรายการ</p>';
 let h='<div class="sc"><table><thead><tr>'+head.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>';
 for(const[k,g]of grouped(L)){if(k)h+=`<tr class="g"><td colspan="${head.length}"><span>${esc(k)}</span><small>${g.length} รายการ รวม ${fmt(g.reduce((s,x)=>s+x.cost,0))} บาท</small></td></tr>`;h+=g.map(row).join('')}
 return h+'</tbody></table></div>'}
function paint(){
 const q=F.q.toLowerCase(),L=S.filter(x=>(tab==='out')===(x.st==='จำหน่ายแล้ว')&&(!F.reg||x.reg===F.reg)&&(!F.cat||x.cat===F.cat)&&(!F.st||tab!=='reg'||x.st===F.st)&&(!q||(x.name+' '+x.code+' '+(x.note||'')).toLowerCase().includes(q)));
 let h='';
 if(tab==='reg')h=table(['รหัส','รายการ','หมวด','ทะเบียน','วันที่ได้มา','ราคาทุน','ค่าเสื่อมสะสม','สถานะ',''],x=>`<tr><td>${esc(x.code)}</td><td>${esc(x.name)}<br><small>${esc(x.unit)}${x.note?' · '+esc(x.note):''}</small></td><td>${esc(x.cat)}</td><td>${badge(x.reg)}</td><td>${fd(x.d)}</td><td class="n">${fmt(x.cost)}</td><td class="n">${fmt(x.dep)}</td><td class="${x.st==='ชำรุด'?'bd':''}">${x.st}</td><td>${CAN?`<button onclick="openDisp(${x.i})">จำหน่าย</button>`:''}</td></tr>`,L);
 if(tab==='chk'){const n=L.filter(x=>x.chk).length;h=`<div>ตรวจแล้ว ${n} จาก ${L.length} รายการ</div><div class="prog"><i style="width:${L.length?n*100/L.length:0}%"></i></div>`+table(['รหัส','รายการ','วันที่ได้มา','ผลตรวจ','หมายเหตุหรือที่ตั้ง'],x=>`<tr><td>${esc(x.code)}</td><td>${esc(x.name)}<br>${badge(x.reg)}</td><td>${fd(x.d)}</td><td><select onchange="chk(${x.i},this.value)">${['','พบ-ใช้ได้','พบ-ชำรุด','ไม่พบ'].map(o=>`<option value="${o}" ${o===(x.chk?x.chk.r:'')?'selected':''}>${o||'ยังไม่ตรวจ'}</option>`).join('')}</select>${x.chk?'<br><small>'+fd(x.chk.d)+'</small>':''}</td><td><input value="${esc(x.note)}" placeholder="เช่น ห้องตรวจ" onchange="setNote(${x.i},this.value)"></td></tr>`,L)}
 if(tab==='out')h=table(['รหัส','รายการ','ราคาทุน','วันที่จำหน่าย','เหตุผล','เลขที่เอกสาร',''],x=>`<tr><td>${esc(x.code)}</td><td>${esc(x.name)}<br>${badge(x.reg)}</td><td class="n">${fmt(x.cost)}</td><td>${fd(x.disp&&x.disp.d)}</td><td>${esc(x.disp&&x.disp.r)}</td><td>${esc(x.disp&&x.disp.doc)}</td><td>${CAN?`<button onclick="undo(${x.i})">คืนสถานะ</button>`:''}</td></tr>`,L);
 $('#lst').innerHTML=h;document.querySelectorAll('#lst table').forEach(t=>{const hs=[...t.tHead.rows[0].cells].map(c=>c.textContent);t.tBodies[0].querySelectorAll('tr:not(.g)').forEach(r=>[...r.cells].forEach((c,i)=>c.dataset.l=hs[i]||''))})}
function chk(i,r){const x=get(i);x.chk=r?{r,d:today()}:null;if(r==='พบ-ชำรุด')x.st='ชำรุด';if(r==='พบ-ใช้ได้')x.st='ใช้งาน';put(x,'ตรวจ: '+(r||'ยกเลิกผลตรวจ'));paint()}
function openDisp(i){cur=i;const x=get(i);$('#dn').textContent=x.code+' · '+x.name;const t=today().split('-');$('#dd').value=(+t[0]-543)+'-'+t[1]+'-'+t[2];$('#dc').value='';$('#dlg').showModal()}
function doDisp(){const x=get(cur),v=$('#dd').value.split('-');if(v.length<3)return;x.st='จำหน่ายแล้ว';x.disp={d:(+v[0]+543)+'-'+v[1]+'-'+v[2],r:$('#dr').value,doc:$('#dc').value};put(x,'จำหน่าย: '+x.disp.r);$('#dlg').close();render()}
function undo(i){const x=get(i);x.st='ใช้งาน';delete x.disp;put(x,'คืนสถานะ');render()}
function addForm(cats){return`<form class="f" onsubmit="return addItem(event)">
 <label>ชื่อรายการ<input name="n" required></label><label>หน่วยนับ<input name="u" value="เครื่อง"></label>
 <label>หมวด<select name="c">${cats.map(c=>`<option>${c}</option>`).join('')}</select></label><label>รหัสครุภัณฑ์<input name="k" required></label>
 <label>วันที่ได้มา<input type="date" name="d" required oninput="sug(this.form)"></label><label>ราคาทุน (บาท)<input type="number" name="p" min="0" step="0.01" required oninput="sug(this.form)"></label>
 <label>อายุการใช้งาน (ปี)<input type="number" name="l" min="1"></label>
 <label>ทะเบียน<select name="r"><option>สท.2</option><option>สท.3</option></select><small id="hint">ระบบแนะนำให้ตามราคาและวันที่ได้มา แก้เองได้</small></label>
 <div><button class="pri">บันทึกครุภัณฑ์ใหม่</button></div></form>`}
function sug(f){if(!f.d.value||!f.p.value)return;const y=+f.d.value.slice(0,4)+543;f.r.value=(+f.p.value>=10000&&y>=2560)?'สท.2':'สท.3'}
function addItem(e){e.preventDefault();const f=e.target,v=f.d.value.split('-'),r=f.r.value;
 const it={i:nid(),cat:f.c.value,reg:r,name:f.n.value,unit:f.u.value,code:f.k.value,d:(+v[0]+543)+'-'+v[1]+'-'+v[2],life:f.l.value?+f.l.value:null,cost:+f.p.value,dep:r==='สท.2'?0:null,st:'ใช้งาน',note:''};put(it,'รับเข้าใหม่');F={q:f.n.value,reg:'',cat:'',st:'',g:''};tab='reg';render();return false}
async function imp(inp){
 const f=inp.files[0];if(!f)return;P=[];const cnt={};
 try{const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});
 for(const n of wb.SheetNames){
  const r=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:null}),
   reg=/สท\.?\s*(3|๓)/.test(r.slice(0,3).flat().join(' '))?'สท.3':'สท.2',s2=reg==='สท.2';
  for(const a of r){if(typeof a[0]!=='number'||!a[1])continue;
   let d=a[4],iso=null;
   if(typeof d==='number'){const c=XLSX.SSF.parse_date_code(d);iso=c.y+'-'+p2(c.m)+'-'+p2(c.d)}
   else{const m=String(d||'').match(/(\d+)\/(\d+)\/(\d{4})/);if(m)iso=m[3]+'-'+p2(m[2])+'-'+p2(m[1])}
   const cost=+a[s2?6:5]||0,dep=s2&&typeof a[7]==='number'?a[7]:null;
   P.push({cat:n,reg,name:String(a[1]).trim(),unit:a[2]||'',code:String(a[3]||'').trim(),d:iso,life:s2?a[5]:null,cost,dep,st:'ใช้งาน',note:''});
   cnt[reg+' · '+n]=(cnt[reg+' · '+n]||0)+1}}
 $('#ip').innerHTML=P.length?'<div class="sc" style="padding:10px">พบ '+P.length+' รายการ<br>'+Object.entries(cnt).map(a=>esc(a[0])+': '+a[1]).join('<br>')+'</div><p><button class="pri" onclick="commit()">ยืนยันนำเข้า</button></p>':'<p class="bd">ไม่พบรายการในไฟล์นี้ ตรวจว่าเป็นไฟล์ สท.2 หรือ สท.3 และมีหัวคอลัมน์ ลำดับ</p>'
 }catch(e){$('#ip').innerHTML='<p class="bd">อ่านไฟล์ไม่ได้ ลองบันทึกไฟล์เป็น .xlsx ใหม่</p>'}}
async function commit(){if(!CAN)return;let n=nid();const arr=P;P=[];$('#ip').textContent='กำลังนำเข้า...';
 try{for(let k=0;k<arr.length;k+=400){const b=db.batch();arr.slice(k,k+400).forEach(x=>{x.i=n++;b.set(db.collection('assets').doc(String(x.i)),x)});await b.commit()}
 await db.collection('history').add({t:TS(),by:ME,act:'นำเข้า Excel '+arr.length+' รายการ',code:'',name:''});tab='reg';render()}catch(e){alert('นำเข้าไม่สำเร็จ: '+e.message)}}
function login(){if(!auth){$('#lm').textContent='ยังไม่ได้ใส่ค่า Firebase ในไฟล์';return}
 auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e=>{$('#lm').textContent='เข้าสู่ระบบไม่สำเร็จ: '+e.message})}
function out(){if(auth)auth.signOut()}
function denied(u){document.body.classList.remove('in');$('#lm').innerHTML='บัญชี '+esc(u.email)+' ยังไม่ได้รับอนุญาต ติดต่อผู้ดูแลระบบ<br><a href="#" onclick="out();return false">ใช้บัญชีอื่น</a>'}
function start(u,role){CAN=role==='editor';ME=u.email;document.body.classList.add('in');
 $('#me').innerHTML=esc(u.email)+'<br>'+(CAN?'สิทธิ์แก้ไข':'ดูอย่างเดียว')+' · <a href="#" onclick="out();return false">ออกจากระบบ</a>';
 let ck=null;tab='home';
 unsub=db.collection('assets').onSnapshot(s=>{S=s.docs.map(d=>d.data());const k=[...new Set(S.map(x=>x.cat))].sort().join('|');
  if(ck===null||k!==ck){ck=k;render()}else if($('#lst'))paint()},e=>alert('อ่านข้อมูลไม่ได้: '+e.message))}
if(CFG.apiKey.indexOf('ใส่')===0){$('#lm').textContent='ยังไม่ได้ใส่ค่า Firebase ในไฟล์ (ดูคู่มือ ข้อ 6)'}
else{firebase.initializeApp(CFG);auth=firebase.auth();db=firebase.firestore();
 auth.onAuthStateChanged(async u=>{if(unsub){unsub();unsub=null}
  if(!u){document.body.classList.remove('in');$('#lm').textContent='';return}
  try{const r=await db.collection('users').doc(u.email.toLowerCase()).get();if(!r.exists)return denied(u);start(u,r.data().role)}catch(e){denied(u)}})}
</script></main></div></div></body></html>
